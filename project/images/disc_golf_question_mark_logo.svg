    <!-- Chains hanging from inner arch -->
    <rect x="190" y="210" width="8" height="30" rx="4"/>
    <rect x="188" y="246" width="8" height="30" rx="4"/>

    <rect x="235" y="188" width="8" height="30" rx="4"/>
    <rect x="233" y="224" width="8" height="30" rx="4"/>
    <rect x="231" y="260" width="8" height="30" rx="4"/>

    <rect x="285" y="176" width="8" height="30" rx="4"/>
    <rect x="285" y="212" width="8" height="30" rx="4"/>
    <rect x="285" y="248" width="8" height="30" rx="4"/>

    <rect x="335" y="182" width="8" height="30" rx="4"/>
    <rect x="335" y="218" width="8" height="30" rx="4"/>

    <rect x="381" y="208" width="8" height="30" rx="4"/>
    <rect x="379" y="244" width="8" height="30" rx="4"/>

    <!-- Basket cage -->
    <path d="
      M 206 670
      L 394 670
      L 378 748
      C 344 768, 256 768, 222 748
      Z"/>

    <!-- Basket inner cutouts -->
    <rect x="240" y="682" width="10" height="66" fill="#ffffff"/>
    <rect x="290" y="682" width="10" height="66" fill="#ffffff"/>
    <rect x="340" y="682" width="10" height="66" fill="#ffffff"/>

    <path d="M 224 704 L 376 704 L 372 716 L 228 716 Z" fill="#ffffff"/>
    <path d="M 219 730 L 381 730 L 377 742 L 223 742 Z" fill="#ffffff"/>

    <!-- Pole -->
    <rect x="286" y="764" width="28" height="110" rx="10"/>

    <!-- Dot / base -->
    <ellipse cx="300" cy="850" rx="84" ry="20"/>
  </g>
</svg>
