<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Disc golf question mark logo</title>
  <desc id="desc">A simple black vector logo combining a question mark with a disc golf basket, chains, and a flying disc.</desc>

  <g fill="#111111" stroke="none">
    <!-- Main question mark body -->
    <path d="
      M 300 120
      C 190 120, 120 190, 120 275
      C 120 302, 142 324, 170 324
      C 198 324, 220 302, 220 275
      C 220 238, 254 210, 300 210
      C 352 210, 388 246, 388 296
      C 388 340, 365 374, 328 414
      C 284 463, 265 500, 265 560
      L 265 595
      C 265 617, 283 635, 305 635
      C 327 635, 345 617, 345 595
      L 345 570
      C 345 535, 357 512, 389 476
      C 437 423, 478 379, 478 295
      C 478 191, 399 120, 300 120
      Z"/>

    <!-- Flying disc -->
    <path d="
      M 212 332
      C 252 304, 320 295, 370 314
      C 382 319, 384 334, 374 343
      C 344 371, 263 377, 215 359
      C 200 354, 198 341, 212 332
      Z"/>
    <path d="
      M 257 323
      C 276 314, 306 314, 326 321
      C 316 329, 292 334, 267 333
      C 261 333, 257 329, 257 323
      Z" fill="#ffffff"/>
    <path d="
      M 176 372
      L 240 350
      L 190 392
      Z"/>
    <path d="
      M 155 388
      L 226 362
      L 172 406
      Z"/>

    <!-- Basket top rim -->
